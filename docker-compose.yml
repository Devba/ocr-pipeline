services:
  app:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      PORT: "8000"
      ADMIN_STATS_TOKEN: "${ADMIN_STATS_TOKEN:-}"
      METRICS_IP_SECRET: "${METRICS_IP_SECRET:-}"
      OPENCLAW_WEBHOOK_SECRET: "${OPENCLAW_WEBHOOK_SECRET:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-0}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      FACE_ANTIBOT_ENABLED: "${FACE_ANTIBOT_ENABLED:-0}"
      FACE_ANTIBOT_TEST_MODE: "${FACE_ANTIBOT_TEST_MODE:-0}"
      FACE_ANTIBOT_SECRET: "${FACE_ANTIBOT_SECRET:-change-this-in-production}"
      FACE_ANTIBOT_CHALLENGE_TTL_MS: "${FACE_ANTIBOT_CHALLENGE_TTL_MS:-120000}"
      PAYPAL_ENV: "${PAYPAL_ENV:-sandbox}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_CURRENCY: "${PAYPAL_CURRENCY:-EUR}"
      PAYPAL_UNLOCK_AMOUNT: "${PAYPAL_UNLOCK_AMOUNT:-1.00}"

      # Google Document AI (OCR) - opcional
      DOC_AI_ENABLED: "${DOC_AI_ENABLED:-0}"
      DOC_AI_PROJECT_ID: "${DOC_AI_PROJECT_ID:-}"
      DOC_AI_LOCATION: "${DOC_AI_LOCATION:-us}"
      DOC_AI_PROCESSOR_ID: "${DOC_AI_PROCESSOR_ID:-}"
      DOC_AI_PROCESSOR_VERSION_ID: "${DOC_AI_PROCESSOR_VERSION_ID:-}"
      DOC_AI_SUMMARY_CHARS: "${DOC_AI_SUMMARY_CHARS:-1200}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
