server {
  listen 80;
  listen [::]:80;

  server_name manuscritos.live www.manuscritos.live;

  client_max_body_size 10m;

  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  server_name manuscritos.live www.manuscritos.live;

  client_max_body_size 10m;

  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

  ssl_certificate /etc/letsencrypt/live/manuscritos.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/manuscritos.live/privkey.pem;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
